# airplay.conf — configuration propre à cette enceinte.
# Modifiable depuis n'importe quel ordinateur (partition boot FAT32).
# Syntaxe shell : NOM="valeur", sans espaces autour du "=".

# Nom affiché sur l'iPhone / le Mac
NAME="Salon"

# Nom réseau (facultatif, déduit de NAME : "Salon" -> "salon")
#HOSTNAME="salon"

# Wi-Fi (laisser WIFI_SSID vide pour l'Ethernet seul)
WIFI_SSID=""
WIFI_PSK=""
WIFI_COUNTRY="FR"

# Sortie ALSA et mixer matériel utilisé pour le volume
# (vérifier avec "aplay -l" et "amixer scontrols" ; MIXER="" = volume logiciel)
OUTPUT_DEVICE="hw:0"
MIXER="Digital"

# "basic" (Pi 2 B, peu de CPU) ou "auto"
INTERPOLATION="basic"

# Commandes amixer appliquées au démarrage, séparées par ";" (facultatif)
# ex. DigiAMP+ : AMIXER_CMDS="-c 0 sset Analogue 0dB;-c 0 sset 'Analogue Playback Boost' 0dB"
AMIXER_CMDS=""
