# airplay.conf — settings for this speaker.
# Editable from any computer (FAT32 boot partition).
# Shell syntax: KEY="value", no spaces around "=".

# Name shown on the iPhone / Mac
NAME="Living Room"

# Network hostname (optional, derived from NAME: "Living Room" -> "living-room")
#HOSTNAME="living-room"

# Wi-Fi (leave WIFI_SSID empty for Ethernet only)
WIFI_SSID=""
WIFI_PSK=""
WIFI_COUNTRY="FR"

# ALSA output and hardware mixer used for the volume
# (check with "aplay -l" and "amixer scontrols"; MIXER="" = software volume)
OUTPUT_DEVICE="hw:0"
MIXER="Digital"

# Channel mix, for a speaker with a single driver:
#   stereo   L -> L, R -> R (default)
#   mono     (L+R)/2 on both outputs: one driver, wired to either side
#   left     left channel only, sent to both outputs
#   right    right channel only, sent to both outputs
#   reverse  L and R swapped
AUDIO_MODE="stereo"

# "basic" (Pi 2 B, little CPU) or "auto"
INTERPOLATION="basic"

# amixer commands applied at boot, separated by ";" (optional)
# e.g. DigiAMP+: AMIXER_CMDS="-c 0 sset Analogue 0dB;-c 0 sset 'Analogue Playback Boost' 0dB"
AMIXER_CMDS=""
