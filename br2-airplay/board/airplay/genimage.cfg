image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/airplay.conf",
			"rpi-firmware/overlays",
			"bcm2709-rpi-2-b.dtb",
			"bcm2710-rpi-2-b.dtb",
			"bcm2710-rpi-3-b.dtb",
			"bcm2710-rpi-3-b-plus.dtb"
		}
		file kernel7.img {
			image = "zImage"
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}
}
