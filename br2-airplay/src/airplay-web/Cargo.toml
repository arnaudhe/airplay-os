[package]
name = "airplay-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Read-only web interface: status of an AirPlay 2 speaker"
license = "MIT"
publish = false

# No external dependencies: the Buildroot package builds offline
# (cargo --offline --locked) with nothing to download.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
